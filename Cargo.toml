[package]
name = "zpl-converter"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "system_fonts", "wayland", "x11"] }
reqwest = { version = "0.12.15", default-features = false, features = ["blocking", "rustls-tls"] }
rfd = "0.17.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
